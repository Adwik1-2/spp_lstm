name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install numpy==2.3.1 pandas==2.3.1
      - name: Compile and test
        run: |
          python -m compileall -q app.py forecasting.py
          python -m unittest discover -s tests -v
